<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />

  <link rel="icon" href="images/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96x96.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>googlemap_custom</title>
  <style>
    html, body{ width:100%; overflow-x: clip; }
    *{ box-sizing:border-box; }
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin:0;
      background:#f3f4f6;
      color:#111;
    }
    .topbar{
      width:min(980px, 100%);
      margin:18px auto 0;
      padding:0 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .backLink{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #e5e7eb;
      background:#fff;
      color:#111;
      text-decoration:none;
      font-weight:900;
      font-size:14px;
    }
    .backLink:active{ transform:translateY(1px); }

    .wrap{
      width:min(980px, 100%);
      margin:24px auto;
      padding:16px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
    .panel{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:16px;
      overflow:hidden;
      max-width:100%;
    }
    .previewBox{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:16px;
      display:grid;
      place-items:center;
      width:100%;
      overflow:hidden;
    }
    canvas{
      display:block;
      width:min(420px, 100%);
      height:auto;
      background:#fff;
      border-radius:20px;
      border:1px solid #e5e7eb;
    }
    @media (max-width:900px){
      .wrap{ grid-template-columns:1fr; }
      canvas{ width:min(520px, 100%); }
    }

    h1{ font-size:22px; margin:0 0 10px; }
    .sub{ color:#6b7280; font-size:13px; line-height:1.5; margin:0 0 14px; }

    label{
      display:grid;
      gap:6px;
      margin-top:10px;
      font-weight:800;
      min-width:0;
    }
    input{
      width:100%;
      max-width:100%;
      min-width:0;
      padding:12px;
      border:1px solid #d1d5db;
      border-radius:12px;
      font-size:16px;
      outline:none;
    }
    input[type="file"]{ width:100%; max-width:100%; }

    .btn{
      margin-top:14px;
      width:100%;
      padding:14px;
      border:0;
      border-radius:14px;
      background:#517efb;
      color:#fff;
      font-size:18px;
      font-weight:900;
      cursor:pointer;
    }
    .btn2{
      margin-top:10px;
      width:100%;
      padding:12px;
      border:1px solid #111;
      border-radius:14px;
      background:#fff;
      color:#111;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }
    .btn2[disabled], .btn[disabled]{
      opacity:0.55;
      cursor:not-allowed;
    }

    .notice{
      display:none;
      margin-top:12px;
      padding:12px 14px;
      border-radius:12px;
      background:#f1f5f9;
      color:#0f172a;
      font-weight:900;
      line-height:1.5;
    }
    .notice .sub2{
      font-weight:650;
      color:#475569;
      margin-top:4px;
    }

    .titleRow{
      display:flex;
      align-items:baseline;
      gap:10px;
    }
    .patchNoteLink{
      font-size:13px;
      color:#6b7280;
      text-decoration:underline;
      font-weight:600;
      cursor:pointer;
      white-space:nowrap;
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    .patchNoteLink:hover{ color:#374151; }
    .patchNoteLink .patchIcon{
      width:14px !important;
      height:14px !important;
      max-width:14px !important;
      max-height:14px !important;
      display:inline-block !important;
      flex:0 0 auto;
    }

    /* segmented */
    .segWrap{ margin-top:10px; display:grid; gap:8px; }
    .segLabel{ font-weight:800; }
    .seg{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .segBtn{
      width:100%;
      padding:12px;
      border:1px solid #111;
      border-radius:14px;
      background:#fff;
      color:#111;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }
    .segBtn.active{
      background:#517efb;
      border-color:#517efb;
      color:#fff;
    }

    /* mode switch */
    .modeSeg{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }

    .videoEdit{
      display:none;
      margin-top:12px;
      padding:12px 14px;
      border-radius:12px;
      background:#f8fafc;
      border:1px solid #e5e7eb;
    }
    .videoEditTitle{ font-weight:900; color:#0f172a; margin-bottom:10px; }
    #videoPreview, #videoOutPreview{
      width:100%;
      max-width:100%;
      border-radius:12px;
      border:1px solid #e5e7eb;
      background:#000;
      display:block;
      margin-bottom:10px;
    }
    .videoMeta{
      margin-top:6px;
      color:#475569;
      font-weight:650;
      font-size:13px;
      line-height:1.5;
    }
    .row2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      margin-top:10px;
    }
  
    .subNote{
      font-size:12px;
      color:#6b7280;
      margin-top:8px;
      line-height:1.4;
      display:none;
    }
</style>
</head>
<body>
  <div class="topbar">
    <a class="backLink" href="./index.html" aria-label="처음으로">처음으로</a>
  </div>

  <div class="wrap">
    <div class="panel">
      <div class="titleRow">
        <h1>구글맵st 프레임 생성기</h1>
        <a
          href="https://www.notion.so/2ea05b04aa9f8060bc71e97dda32e332"
          target="_blank"
          rel="noopener noreferrer"
          class="patchNoteLink"
          title="패치노트 보기"
        >
          <img src="images/icons8.svg" class="patchIcon" alt="">
          패치노트
        </a>
      </div>
      <p class="sub">이미지 또는 영상을 선택해 구글맵 느낌의 프레임을 생성합니다.</p>

      <div class="segWrap">
        <div class="segLabel">모드</div>
        <div class="modeSeg" role="group" aria-label="모드">
          <button class="segBtn" id="modeImage" type="button">이미지</button>
          <button class="segBtn" id="modeVideo" type="button">영상</button>
        </div>
      </div>

      <label id="fileLabel">이미지 파일<input id="mediaFile" type="file" accept="image/*" /></label>

      <label>장소명<input id="place" type="text" placeholder="예: 인천공항" /></label>
      <label>별점 (비우면 랜덤)<input id="rating" type="text" placeholder="예: 3.4" /></label>
      <label>리뷰수 (비우면 랜덤)<input id="reviews" type="text" placeholder="예: 58" /></label>
      <label>카테고리 <input id="category" type="text" placeholder="예: Airport" /></label>

      <div class="segWrap">
        <div class="segLabel">이미지 속 언어</div>
        <div class="seg" role="group" aria-label="이미지 속 언어">
          <button class="segBtn" id="langKo" type="button">한국어</button>
          <button class="segBtn" id="langEn" type="button">English</button>
        </div>
      </div>

      <!-- 이미지 모드 버튼 -->
      <div id="imageActions">
        <button class="btn" id="genImage" type="button">이미지 생성하기</button>
        <button class="btn2" id="dlImage" type="button" disabled>이미지 저장</button>
        <div class="notice" id="noticeImage">
          <div>완성!</div>
          <div class="sub2">“이미지 저장” 버튼으로 PNG를 저장하세요.</div>
        </div>
      </div>

      <!-- 영상 모드 -->
      <div class="videoEdit" id="videoEdit" aria-live="polite">
        <div class="videoEditTitle">영상 편집 (최대 7초)</div>
        <video id="videoPreview" muted playsinline></video>

        <div class="row2">
          <button class="btn2" id="videoPlay" type="button" disabled>재생</button>
          <button class="btn2" id="videoPause" type="button" disabled>일시정지</button>
        </div>

        <label>시작 지점 (초)
          <input id="trimStart" type="range" min="0" max="0" step="0.05" value="0" />
        </label>

        <label>길이 (초, 최대 7초)
          <input id="trimLen" type="range" min="0.5" max="7" step="0.05" value="7" />
        </label>

        <div class="videoMeta" id="videoMeta"></div>

        <button class="btn" id="genVideo" type="button" disabled>영상 생성하기</button>

        <div class="subNote" id="firstGenHint">첫 생성 시 시간이 걸릴 수 있습니다.</div>

        <div id="videoOutWrap" style="display:none;">
          <div class="videoEditTitle" style="margin-top:12px;">미리보기</div>
          <video id="videoOutPreview" playsinline controls></video>
          <button class="btn2" id="dlVideo" type="button" disabled>동영상 저장 (MP4)</button>
          <div class="videoMeta" id="videoMeta2"></div>
        </div>
      </div>
    </div>

    <div class="previewBox" id="previewBox">
      <canvas id="c" width="1080" height="1440"></canvas>
    </div>
  </div>

<script>
  "use strict";

  // ===== 상태 =====
  const MAX_CLIP_SEC = 7;
  let mode = "image"; // "image" | "video"
  let currentLang = "en"; // "ko" | "en"

  let loadedVideoEl = null;        // hidden decode video (for reliable drawImage)
  let loadedVideoUrl = null;       // blob url for hidden video
  let lastVideoBlob = null;        // final mp4
  let lastVideoUrl = null;         // preview url

  let firstGenHintShown = false;
  function maybeShowFirstGenHint(){
    if (firstGenHintShown) return;
    firstGenHintShown = true;
    const el = $("firstGenHint");
    if (el) el.style.display = "block";
  }


  const I18N = {
    en: { route:"Directions", call:"Call", save:"Save", share:"Share" },
    ko: { route:"경로", call:"전화", save:"저장", share:"공유" }
  };

  const $ = (id) => document.getElementById(id);
  const canvas = $("c");
  const ctx = canvas.getContext("2d");

  // ===== 유틸 =====
  function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function randRating(){ return (Math.round((Math.random()*2 + 2.8)*10)/10).toFixed(1); }
  function sanitizeFilename(s){
    const cleaned=(s||"place").replace(/[\\\/:*?"<>|]/g,"").replace(/\s+/g," ").trim();
    return cleaned.length ? cleaned : "place";
  }
  function safeBaseFilename(raw) {
    const s = sanitizeFilename((raw || "").trim());
    return (s || "googlemap_custom").slice(0, 60);
  }
  function scrollToEl(el){
    try{ el.scrollIntoView({ behavior:"smooth", block:"start" }); } catch(_){}
  }

  function setMode(next){
    mode = next;
    $("modeImage").classList.toggle("active", mode==="image");
    $("modeVideo").classList.toggle("active", mode==="video");

    // 파일 입력 accept 분리
    const input = $("mediaFile");
    input.value = "";
    if (mode === "image"){
      $("fileLabel").firstChild.textContent = "이미지 파일";
      input.accept = "image/*";
      $("imageActions").style.display = "block";
      $("videoEdit").style.display = "none";
      $("previewBox").style.display = "block";
      $("noticeImage").style.display = "none";
      $("dlImage").disabled = true;
      resetVideoState(true);
    } else {
      $("fileLabel").firstChild.textContent = "영상 파일";
      input.accept = "video/*";
      $("imageActions").style.display = "none";
      $("videoEdit").style.display = "none"; // 파일 선택 후 표시
      $("previewBox").style.display = "none";
      $("noticeImage").style.display = "none";
      $("dlImage").disabled = true;
      resetVideoState(true);
    }
  }

  function setLang(lang){
    currentLang = (lang === "en") ? "en" : "ko";
    const koOn = currentLang === "ko";
    const enOn = currentLang === "en";
    $("langKo").classList.toggle("active", koOn);
    $("langEn").classList.toggle("active", enOn);
    $("langKo").setAttribute("aria-pressed", String(koOn));
    $("langEn").setAttribute("aria-pressed", String(enOn));

    // 미리보기 즉시 반영
    if (mode === "image" && $("mediaFile").files?.[0]){
      renderImage().catch(e => alert(e?.message ?? "오류"));
    }
    if (mode === "video" && loadedVideoEl){
      renderFirstVideoFrame().catch(_=>{});
    }
  }

  // ===== 이미지 로드 =====
  async function loadImageFromFile(file){
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.crossOrigin = "anonymous";
    await new Promise((resolve,reject)=>{
      img.onload = resolve;
      img.onerror = ()=>reject(new Error("이미지 로드 실패"));
      img.src = url;
    });
    return { img, url };
  }

  // ===== 비디오 로드(숨김 DOM에 붙여 안정화) =====
  async function loadVideoFromBlob(blob){
    const url = URL.createObjectURL(blob);
    const v = document.createElement("video");
    v.src = url;
    v.muted = true;
    v.playsInline = true;
    v.preload = "auto";
    v.crossOrigin = "anonymous";
    v.style.position = "fixed";
    v.style.left = "-99999px";
    v.style.top = "0";
    v.style.width = "1px";
    v.style.height = "1px";
    v.style.opacity = "0";
    document.body.appendChild(v);

    await new Promise((resolve, reject) => {
      let settled = false;
      const cleanup = () => {
        v.removeEventListener("loadedmetadata", onMeta);
        v.removeEventListener("canplay", onCanPlay);
        v.removeEventListener("loadeddata", onLoadedData);
        v.removeEventListener("error", onErr);
      };
      const done = () => {
        if (settled) return;
        settled = true;
        cleanup();
        resolve();
      };
      const fail = () => {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error("영상 디코딩 실패"));
      };
      const onMeta = () => { /* metadata ok */ };
      const onCanPlay = () => done();
      const onLoadedData = () => done();
      const onErr = () => fail();

      v.addEventListener("loadedmetadata", onMeta, { once:true });
      v.addEventListener("canplay", onCanPlay, { once:true });
      v.addEventListener("loadeddata", onLoadedData, { once:true });
      v.addEventListener("error", onErr, { once:true });

      // 일부 코덱은 canplay까지 시간이 오래 걸릴 수 있어 타임아웃을 둠
      const t = setTimeout(() => {
        if (settled) return;
        // loadedmetadata라도 있으면 시도는 가능하므로 진행
        if (v.readyState >= 1) done();
        else fail();
      }, 8000);

      v.load();
    });

    return { v, url };
  }

  function resetVideoState(revokePreview){
    $("videoMeta").textContent = "";
    $("videoMeta2").textContent = "";
    $("videoPlay").disabled = true;
    $("videoPause").disabled = true;
    $("genVideo").disabled = true;
    $("dlVideo").disabled = true;

    $("videoOutWrap").style.display = "none";
    const out = $("videoOutPreview");
    try{
      out.pause();
      if (revokePreview && out.src && out.src.startsWith("blob:")) URL.revokeObjectURL(out.src);
    } catch(_){}
    out.removeAttribute("src");
    out.load();

    if (revokePreview && lastVideoUrl){
      try{ URL.revokeObjectURL(lastVideoUrl); } catch(_){}
    }
    lastVideoUrl = null;
    lastVideoBlob = null;

    // hidden decode video 정리
    try{
      if (loadedVideoEl){
        loadedVideoEl.pause();
        loadedVideoEl.remove();
      }
    } catch(_){}
    loadedVideoEl = null;
    if (loadedVideoUrl){
      try{ URL.revokeObjectURL(loadedVideoUrl); } catch(_){}
      loadedVideoUrl = null;
    }

    // editor preview 정리
    const pv = $("videoPreview");
    try{
      pv.pause();
      if (revokePreview && pv.src && pv.src.startsWith("blob:")) URL.revokeObjectURL(pv.src);
    } catch(_){}
    pv.removeAttribute("src");
    pv.load();
  }

  function setVideoMetaText(dur, start, len){
    const s1 = `원본 길이: ${dur.toFixed(2)}초`;
    const s2 = `선택 구간: ${start.toFixed(2)}s ~ ${(start + len).toFixed(2)}s (총 ${len.toFixed(2)}초)`;
    $("videoMeta").textContent = `${s1} / ${s2}`;
  }

  async function seekVideo(videoEl, t){
    const target = Math.max(0, t);
    await new Promise((resolve) => {
      const onSeeked = () => { videoEl.removeEventListener("seeked", onSeeked); resolve(); };
      videoEl.addEventListener("seeked", onSeeked);
      videoEl.currentTime = target;
    });
  }

  // ===== 캔버스 렌더(이미지/비디오 공통) =====
  const TITLE_FONT_FAMILY = `"Google Sans","Product Sans",Roboto,system-ui,-apple-system,Segoe UI,sans-serif`;

  function fitCoverAnchored(imgW,imgH, boxW,boxH, ax=0.5, ay=1.0){
    const imgRatio = imgW/imgH;
    const boxRatio = boxW/boxH;
    let sw, sh, sx, sy;
    if (imgRatio > boxRatio){
      sh = imgH;
      sw = imgH * boxRatio;
      sx = (imgW - sw) * ax;
      sy = 0;
    } else {
      sw = imgW;
      sh = imgW / boxRatio;
      sx = 0;
      sy = (imgH - sh) * ay;
    }
    sx = clamp(sx, 0, Math.max(0, imgW - sw));
    sy = clamp(sy, 0, Math.max(0, imgH - sh));
    return { sx, sy, sw, sh };
  }

  function roundRectPath(ctx,x,y,w,h,r){
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y, x+w,y+h, rr);
    ctx.arcTo(x+w,y+h, x,y+h, rr);
    ctx.arcTo(x,y+h, x,y, rr);
    ctx.arcTo(x,y, x+w,y, rr);
    ctx.closePath();
  }
  function topRoundRectPath(ctx,x,y,w,h,r){
    const rr = Math.min(r, w/2, h);
    ctx.beginPath();
    ctx.moveTo(x, y+rr);
    ctx.arcTo(x,y, x+rr,y, rr);
    ctx.lineTo(x+w-rr, y);
    ctx.arcTo(x+w,y, x+w,y+rr, rr);
    ctx.lineTo(x+w, y+h);
    ctx.lineTo(x, y+h);
    ctx.closePath();
  }
  function fillTopRoundRect(x,y,w,h,r,fill){
    ctx.save();
    topRoundRectPath(ctx,x,y,w,h,r);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
  }
  function fillRoundRect(x,y,w,h,r,fill){
    ctx.save();
    roundRectPath(ctx,x,y,w,h,r);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();
  }
  function drawHandleBar(cx,y,w){
    fillRoundRect(cx-w/2, y, w, 10, 8, "#d1d5db");
  }
  function drawCircleButton(cx,cy,r,bg){
    ctx.save();
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  function drawShareIconDark(cx,cy){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(0.85, 0.85);
    ctx.translate(-cx, -cy);
    ctx.strokeStyle="#111827";
    ctx.lineWidth=6.3;
    ctx.lineCap="round";
    ctx.lineJoin="round";
    ctx.beginPath();
    ctx.moveTo(cx, cy+11);
    ctx.lineTo(cx, cy-16);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx-11, cy-4);
    ctx.lineTo(cx, cy-18);
    ctx.lineTo(cx+11, cy-4);
    ctx.stroke();
    ctx.lineWidth=5.9;
    ctx.beginPath();
    ctx.moveTo(cx-17, cy+14);
    ctx.lineTo(cx-17, cy+26);
    ctx.lineTo(cx+17, cy+26);
    ctx.lineTo(cx+17, cy+14);
    ctx.stroke();
    ctx.restore();
  }
  function drawCloseX(cx,cy){
    ctx.save();
    ctx.strokeStyle="#111827";
    ctx.lineWidth=6.0;
    ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(cx-9, cy-9);
    ctx.lineTo(cx+9, cy+9);
    ctx.moveTo(cx+9, cy-9);
    ctx.lineTo(cx-9, cy+9);
    ctx.stroke();
    ctx.restore();
  }
  function drawStar(x,y,size,filled){
    const s=size;
    const cx=x+s/2, cy=y+s/2;
    const spikes=5;
    const outer=s*0.5;
    const inner=s*0.22;
    let rot=Math.PI/2*3;
    ctx.beginPath();
    ctx.moveTo(cx, cy-outer);
    for(let i=0;i<spikes;i++){
      ctx.lineTo(cx+Math.cos(rot)*outer, cy+Math.sin(rot)*outer);
      rot += Math.PI/spikes;
      ctx.lineTo(cx+Math.cos(rot)*inner, cy+Math.sin(rot)*inner);
      rot += Math.PI/spikes;
    }
    ctx.closePath();
    ctx.fillStyle = filled ? "#f4b400" : "rgba(0,0,0,0.10)";
    ctx.fill();
  }
  function drawStarRow(x,baselineY,rating,starSize,step){
    const r=clamp(rating,0,5);
    const full=Math.floor(r);
    const topY = baselineY - starSize + 10;
    for(let i=0;i<5;i++){
      drawStar(x+i*step, topY, starSize, i<full);
    }
  }
  function measureTextBox(text,font){
    ctx.save();
    ctx.font=font;
    const m=ctx.measureText(text);
    const asc=m.actualBoundingBoxAscent ?? 0;
    const desc=m.actualBoundingBoxDescent ?? 0;
    ctx.restore();
    return { w:m.width, asc, desc, h:asc+desc };
  }
  function fitLabel(text, maxW, basePx, minPx){
    let px = basePx;
    let font = `700 ${px}px ${TITLE_FONT_FAMILY}`;
    let box = measureTextBox(text, font);
    while (box.w > maxW && px > minPx) {
      px--;
      font = `700 ${px}px ${TITLE_FONT_FAMILY}`;
      box = measureTextBox(text, font);
    }
    if (box.w > maxW) {
      const ell = "…";
      let lo = 1, hi = text.length, best = ell;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        const cand = text.slice(0, mid) + ell;
        const b2 = measureTextBox(cand, font);
        if (b2.w <= maxW) { best = cand; lo = mid + 1; }
        else { hi = mid - 1; }
      }
      return { text: best, font, px };
    }
    return { text, font, px };
  }

  const MAP_LIGHT="#C9FCFF";
  const MAP_TEAL ="#2C767D";
  const INACTIVE_INK="#124B52";

  function drawDirectionIcon(icx,icy,active){
    const arrowColor = active ? MAP_TEAL : INACTIVE_INK;
    const d=30;
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.moveTo(icx, icy-d);
    ctx.lineTo(icx+d, icy);
    ctx.lineTo(icx, icy+d);
    ctx.lineTo(icx-d, icy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = arrowColor;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = 5.0;
    const ox = -3;
    const xStem = icx + ox - 4;
    const yBottom = icy + 8;
    const yTop = icy - 3;
    const xRight = icx + ox + 16;
    ctx.beginPath();
    ctx.moveTo(xStem, yBottom);
    ctx.lineTo(xStem, yTop);
    ctx.lineTo(xRight, yTop);
    ctx.stroke();
    ctx.lineWidth = 4.0;
    const headBack = 7;
    const headUp = 6;
    const headDown = 6;
    ctx.beginPath();
    ctx.moveTo(xRight, yTop);
    ctx.lineTo(xRight - headBack, yTop - headUp);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(xRight, yTop);
    ctx.lineTo(xRight - headBack, yTop + headDown);
    ctx.stroke();
    ctx.restore();
  }
  function drawSaveIcon(icx,icy,stroke){
    ctx.save();
    ctx.strokeStyle=stroke;
    ctx.lineWidth=6.1;
    ctx.lineJoin="round";
    const bw=30, bh=40;
    const bx=icx-bw/2, by=icy-bh/2;
    ctx.beginPath();
    ctx.moveTo(bx,by);
    ctx.lineTo(bx+bw,by);
    ctx.lineTo(bx+bw,by+bh);
    ctx.lineTo(icx,by+bh-12);
    ctx.lineTo(bx,by+bh);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
  function drawCallHandset(icx, icy, color){

    const px = 65;
    const scale = px / 24;

    ctx.translate(-12, -12);

    const p = new Path2D(
      "M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2" +

      "c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57" +
      ".11.35.03.74-.25 1.02l-2.2 2.2z"
    );

  function drawShareIcon(icx,icy,stroke){

  function drawPillButton(x,y,w,h,fill,iconKind,label,active){
    fillRoundRect(x,y,w,h,h/2,fill);
    const iconColor = active ? "#fff" : INACTIVE_INK;
    const textColor = active ? "#fff" : INACTIVE_INK;
    const icx = x + w*0.28;
    const icy = y + h/2;
    ctx.save();
    ctx.translate(icx, icy);
    ctx.scale(1.15, 1.15);
    ctx.translate(-icx, -icy);
    if(iconKind==="route") drawDirectionIcon(icx,icy,active);
    if(iconKind==="call")  drawCallHandset(icx,icy,iconColor);
    if(iconKind==="save")  drawSaveIcon(icx,icy,iconColor);
    if(iconKind==="share") drawShareIcon(icx,icy,iconColor);
    ctx.restore();
    const textPadL = w*0.44;
    const maxTextW = w - textPadL - (w*0.10);
    const fitted = fitLabel(label, maxTextW, 44, 40);
    const box = measureTextBox(fitted.text, fitted.font);
    const visualCenterOffset = (box.asc - box.desc) * 0.06;
    ctx.save();
    ctx.fillStyle=textColor;
    ctx.font=fitted.font;
    ctx.textBaseline="middle";
    ctx.fillText(fitted.text, x+textPadL, y+h/2+visualCenterOffset);
    ctx.restore();
  }

  function drawOverlay(placeRaw, category, rNum, reviews){
    const W = canvas.width;
    const H = canvas.height;

    const sheetH = Math.round(clamp(H * 0.255, 460, 560));
    const sheetY = H - sheetH;
    const sheetR = 78;

    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.22)";
    ctx.shadowBlur=40;
    ctx.shadowOffsetY=-10;
    fillTopRoundRect(0, sheetY, W, sheetH, sheetR, "#fff");
    ctx.restore();

    drawHandleBar(W/2, sheetY + Math.round(sheetH*0.035), Math.round(W*0.13));

    const padL = 86;
    const rightPad = 78;

    const btnR = 56;
    const btnCY = sheetY + Math.round(sheetH*0.23);
    const closeCX = W - rightPad - btnR;
    const shareCX = closeCX - (btnR*2 + 54);

    drawCircleButton(shareCX, btnCY, btnR, "#f3f4f6");
    drawShareIconDark(shareCX, btnCY);

    drawCircleButton(closeCX, btnCY, btnR, "#f3f4f6");
    drawCloseX(closeCX, btnCY);

    const titleY = btnCY + 10;
    let titlePx = 82;
    const minTitlePx = 52;
    const titleEndX = shareCX - btnR - 30;
    const maxTitleW = Math.max(120, titleEndX - padL);
    titlePx = Math.min(titlePx, Math.floor(sheetH * 0.135));
    const fittedTitle = fitLabel(placeRaw, maxTitleW, titlePx, minTitlePx);

    ctx.save();
    ctx.fillStyle = "#111";
    ctx.font = fittedTitle.font;
    ctx.textBaseline = "middle";
    ctx.fillText(fittedTitle.text, padL, titleY);
    ctx.restore();

    const rateY = sheetY + Math.round(sheetH*0.44);
    const ratePx = 56;

    ctx.save();
    ctx.fillStyle="#6b7280";
    ctx.font=`300 ${ratePx}px ${TITLE_FONT_FAMILY}`;
    ctx.textBaseline="alphabetic";
    const rateText = rNum.toFixed(1);
    ctx.fillText(rateText, padL, rateY);
    const rateW = ctx.measureText(rateText).width;
    ctx.restore();

    const starGap = 16;
    const starSize = 54;
    const starStep = 60;
    const starX = padL + rateW + starGap;
    drawStarRow(starX, rateY, rNum, starSize, starStep);

    const reviewsX = starX + 5*starStep + 3;
    ctx.save();
    ctx.fillStyle="#9ca3af";
    ctx.font=`300 ${ratePx-6}px ${TITLE_FONT_FAMILY}`;
    ctx.textBaseline="alphabetic";
    ctx.fillText(`(${Number(reviews).toLocaleString()})`, reviewsX, rateY);
    ctx.restore();

    if(category){
      const catY = sheetY + Math.round(sheetH*0.58);
      const catPx = 52;
      ctx.save();
      ctx.fillStyle="#9ca3af";
      ctx.font=`300 ${catPx}px ${TITLE_FONT_FAMILY}`;
      ctx.textBaseline="alphabetic";
      ctx.fillText(category, padL, catY);
      ctx.restore();
    }

    const pillH = Math.round(clamp(sheetH*0.22, 108, 124));
    const bottomInset = Math.round(sheetH*0.10);
    const pillsY = H - bottomInset - pillH;

    const rowPad = 30;
    const rowW = W - rowPad * 2;
    const pillGap = 16;
    const overflow = 140;
    const pillW = Math.floor((rowW + overflow - pillGap * 3) / 4);
    const x0 = rowPad;

    const L = I18N[currentLang];

    drawPillButton(x0 + (pillW + pillGap) * 0, pillsY, pillW, pillH, MAP_TEAL,  "route", L.route, true);
    drawPillButton(x0 + (pillW + pillGap) * 1, pillsY, pillW, pillH, MAP_LIGHT, "call",  L.call, false);
    drawPillButton(x0 + (pillW + pillGap) * 2, pillsY, pillW, pillH, MAP_LIGHT, "save",  L.save, false);
    drawPillButton(x0 + (pillW + pillGap) * 3, pillsY, pillW, pillH, MAP_LIGHT, "share", L.share, false);

    return { sheetY, sheetH };
  }

  function toBlobWithTimeout(canvas, type = "image/png", quality, timeoutMs = 4000) {
    return new Promise((resolve, reject) => {
      let done = false;
      const t = setTimeout(() => {
        if (done) return;
        done = true;
        reject(new Error("toBlob timeout"));
      }, timeoutMs);

      try {
        canvas.toBlob(
          (blob) => {
            if (done) return;
            done = true;
            clearTimeout(t);
            resolve(blob);
          },
          type,
          quality
        );
      } catch (e) {
        if (done) return;
        done = true;
        clearTimeout(t);
        reject(e);
      }
    });
  }

  async function downloadPng(){
    const base = safeBaseFilename(($("place").value || "").trim());
    const filename = `${base}_googlemap_custom.png`;

    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua);
    const isKakao = /KAKAOTALK/i.test(ua);
    const isMobile = /Android|iPhone|iPad|iPod/i.test(ua);

    let blob;
    try {
      blob = await toBlobWithTimeout(canvas, "image/png", undefined, 4000);
    } catch (e) {
      alert("이미지 생성에 실패했습니다. (브라우저 제한 또는 메모리 부족)");
      return;
    }
    if (!blob) { alert("이미지 생성에 실패했습니다."); return; }

    if ((isIOS || isKakao) && navigator.share) {
      try {
        const file = new File([blob], filename, { type: "image/png" });
        const canShareFiles = !navigator.canShare || navigator.canShare({ files: [file] });
        if (canShareFiles) {
          await navigator.share({ files: [file], title: filename, text: "이미지 저장" });
          return;
        }
      } catch (_) {}
    }

    const url = URL.createObjectURL(blob);

    if (!isIOS && !isKakao) {
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.rel = "noopener";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      return;
    }

    // 폴백: 인앱 브라우저에서 다운로드가 막히는 경우를 대비해 링크를 안내합니다.
    const linkBox = $("noticeImage");
    if (linkBox){
      linkBox.style.display = "block";
      linkBox.innerHTML = `<div>저장이 막히면 아래 링크를 열어 저장하세요.</div><div class="sub2"><a href="${url}" target="_blank" rel="noopener">이미지 열기</a></div>`;
    }
    // revoke는 여유 있게
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  // ===== 영상 생성: canvas 녹화(WebM) -> FFmpeg MP4 =====
  async function generateVideo(){
    if (!loadedVideoEl) { alert("영상을 먼저 선택해 주세요."); return; }

    const placeRaw = ($("place").value || "").trim();
    if(!placeRaw){ alert("장소명은 필수입니다."); return; }

    const category = ($("category").value || "").trim();
    let rating = ($("rating").value || "").trim();
    let reviews = ($("reviews").value || "").trim();
    if(!rating) rating = randRating();
    if(!reviews) reviews = String(randInt(5, 2500));
    const rNum = clamp(parseFloat(rating), 0, 5);

    const pv = $("videoPreview");
    const durTotal = Number(pv.duration) || Number(loadedVideoEl.duration) || 0;
    const start = Number($("trimStart").value) || 0;
    const len = Number($("trimLen").value) || 0.5;
    const clipDur = Math.min(MAX_CLIP_SEC, Math.max(0.5, Math.min(len, durTotal - start)));
    if (clipDur <= 0.05){ alert("선택 구간이 너무 짧습니다."); return; }

    const prevMuted = loadedVideoEl.muted;
    const prevVolume = (typeof loadedVideoEl.volume === "number") ? loadedVideoEl.volume : 1;

    $("genVideo").disabled = true;
    $("dlVideo").disabled = true;
    $("videoOutWrap").style.display = "none";
    $("videoMeta2").textContent = "영상 생성 중입니다.";

    // 재생 위치 이동
    await seekVideo(loadedVideoEl, start);

    // 캔버스 스트림
    const fps = 30;
    const canvasStream = canvas.captureStream(fps);

    // MediaRecorder
    if (!("MediaRecorder" in window)){
      $("genVideo").disabled = false;
      $("videoMeta2").textContent = "";
      alert("이 브라우저는 영상 녹화를 지원하지 않습니다.");
      return;
    }

    // 가능한 경우 MP4(MediaRecorder)로 바로 생성 (가장 빠르고, CDN/FFmpeg 의존성 없음)
    const mimeCandidates = [
      "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
      "video/mp4;codecs=avc1.64001f,mp4a.40.2",
      "video/mp4",
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8,opus",
      "video/webm"
    ];
    let mimeType = "";
    for (const m of mimeCandidates){
      try{
        if (MediaRecorder.isTypeSupported(m)){ mimeType = m; break; }
      } catch(_){}
    }
    if (!mimeType) mimeType = "video/webm";

    const rec = new MediaRecorder(canvasStream, { mimeType });
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };

    const stopP = new Promise((resolve) => rec.onstop = () => resolve());

    // 렌더 루프
    const W = canvas.width;
    const H = canvas.height;
    const sheetH = Math.round(clamp(H * 0.255, 460, 560));
    const sheetY = H - sheetH;
    const photoOverlap = Math.round(clamp(H * 0.065, 80, 140));
    const photoAreaH = sheetY + photoOverlap;

    const vw = loadedVideoEl.videoWidth || 1080;
    const vh = loadedVideoEl.videoHeight || 1440;
    const crop = fitCoverAnchored(vw, vh, W, photoAreaH, 0.5, 0.5);

    const endTime = start + clipDur;

    // 시작
    rec.start(200);
    try{
      // 생성 중 백그라운드에서 소리가 나지 않도록 무음 처리
      loadedVideoEl.muted = true;
      loadedVideoEl.volume = 0;
      await loadedVideoEl.play();
    } catch(_){}

    const tStart = performance.now();

    await new Promise((resolve) => {
      function tick(){
        ctx.clearRect(0,0,W,H);
        ctx.drawImage(loadedVideoEl, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, W, photoAreaH);
        drawOverlay(placeRaw, category, rNum, reviews);

        const ct = Number(loadedVideoEl.currentTime) || 0;
        const elapsed = (performance.now() - tStart) / 1000;

        if (ct >= endTime - 0.02 || elapsed >= clipDur + 0.5){
          resolve();
          return;
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });

    loadedVideoEl.pause();
    try{ loadedVideoEl.muted = prevMuted; } catch(_){ }
    try{ loadedVideoEl.volume = prevVolume; } catch(_){ }
    rec.stop();
    await stopP;

    // recorder가 MP4를 직접 지원하면 변환 없이 바로 MP4로 사용
    const recordedType = (rec && rec.mimeType) ? rec.mimeType : mimeType;
    const recordedBlob = new Blob(chunks, { type: recordedType || "video/webm" });

    async function showVideoOutput(blob, isMp4){
      lastVideoBlob = blob;

      const out = $("videoOutPreview");
      if (lastVideoUrl) { try{ URL.revokeObjectURL(lastVideoUrl); } catch(_){ lastVideoUrl=null; } }
      lastVideoUrl = URL.createObjectURL(blob);
      out.src = lastVideoUrl;
      out.load();

      $("videoOutWrap").style.display = "block";
      $("dlVideo").disabled = false;

      scrollToEl($("videoOutWrap"));

      out.muted = true;
      out.autoplay = true;
      out.loop = true;
      try{ await out.play(); } catch(_){}

      $("videoMeta2").textContent = isMp4
        ? "완료되었습니다. ‘동영상 저장 (MP4)’를 누르시면 저장됩니다."
        : "완료되었습니다. MP4 변환이 불가하여 WebM으로 생성되었습니다. (가능하면 MP4(H.264) 환경에서 다시 시도해 주세요.)";
      $("genVideo").disabled = false;
    }

    // 1) MP4로 바로 녹화된 경우
    if ((recordedType || "").startsWith("video/mp4")){
      await showVideoOutput(recordedBlob, true);
    } else {
      // 2) WebM인 경우: FFmpeg로 MP4 변환 시도(실패하면 WebM 제공)
      try{
        $("videoMeta2").textContent = "MP4 변환 중입니다.";
        const mp4Blob = await __webmToMp4(recordedBlob);
        await showVideoOutput(mp4Blob, true);
      } catch (e){
        $("videoMeta2").textContent = "MP4 변환에 실패하여 WebM으로 저장됩니다.";
        await showVideoOutput(recordedBlob, false);
      }
    }
  }

  async function downloadVideo(){
    if (!lastVideoBlob){
      alert("먼저 ‘영상 생성하기’를 눌러 영상을 만든 뒤 저장해 주세요.");
      return;
    }
    const base = safeBaseFilename(($("place").value || "").trim());
    const isMp4 = (lastVideoBlob.type || "").startsWith("video/mp4");
    const ext = isMp4 ? "mp4" : "webm";
    const filename = `${base}_googlemap_custom.${ext}`;

    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua);
    const isKakao = /KAKAOTALK/i.test(ua);

    if ((isIOS || isKakao) && navigator.share) {
      try{
        const f = new File([lastVideoBlob], filename, { type: lastVideoBlob.type || "application/octet-stream" });
        const canShareFiles = !navigator.canShare || navigator.canShare({ files: [f] });
        if (canShareFiles) {
          await navigator.share({ files:[f], title: filename, text: "동영상 저장" });
          return;
        }
      } catch(_){}
    }

    const url = URL.createObjectURL(lastVideoBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    a.style.display = "none";
    document.body.appendChild(a);
    try{ a.click(); } catch(_){}
    a.remove();

    // 일부 환경에서 다운로드가 막히면, 아래 링크를 통해 열어서 저장할 수 있도록 안내합니다.
    const meta = $("videoMeta2");
    if (meta){
      const safe = meta.textContent || "";
      meta.innerHTML = `${safe}<div style="margin-top:6px;"><a href="${url}" target="_blank" rel="noopener">영상 열기(저장)</a></div>`;
    }

    setTimeout(() => URL.revokeObjectURL(url), 120000);
  }

  // ===== FFmpeg.wasm (UMD) =====
  let __ffmpegCtx = null;

  function __loadScriptOnce(src){
    return new Promise((resolve, reject) => {
      const existing = document.querySelector(`script[data-ffmpeg-src="${src}"]`);
      if (existing) return resolve();
      const s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.dataset.ffmpegSrc = src;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("FFmpeg 로드 실패"));
      document.head.appendChild(s);
    });
  }

  async function __ensureFfmpeg(){
    if (__ffmpegCtx) return __ffmpegCtx;
    // 1) 같은 오리진에 ffmpeg UMD를 두면(예: /vendor/ffmpeg/ffmpeg.js) 네트워크/CSP 이슈가 줄어듭니다.
    // 2) 없으면 CDN(jsDelivr)로 시도합니다.
    try{
      await __loadScriptOnce("./vendor/ffmpeg/ffmpeg.js");
    } catch(_){
      await __loadScriptOnce("https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js");
    }
    if (!window.FFmpeg || !window.FFmpeg.createFFmpeg || !window.FFmpeg.fetchFile) {
      throw new Error("FFmpeg 초기화 실패");
    }
    const ffmpeg = window.FFmpeg.createFFmpeg({ log: false });
    await ffmpeg.load();
    __ffmpegCtx = { ffmpeg, fetchFile: window.FFmpeg.fetchFile };
    return __ffmpegCtx;
  }

  async function __webmToMp4(webmBlob){
    const { ffmpeg, fetchFile } = await __ensureFfmpeg();
    const inName = "in.webm";
    const outName = "out.mp4";
    ffmpeg.FS("writeFile", inName, await fetchFile(webmBlob));
    await ffmpeg.run(
      "-i", inName,
      "-c:v", "libx264",
      "-pix_fmt", "yuv420p",
      "-movflags", "faststart",
      "-c:a", "aac",
      "-b:a", "128k",
      outName
    );
    const data = ffmpeg.FS("readFile", outName);
    try{ ffmpeg.FS("unlink", inName); } catch(_){}
    try{ ffmpeg.FS("unlink", outName); } catch(_){}
    return new Blob([data.buffer], { type: "video/mp4" });
  }

  async function __blobToMp4(inputBlob, inputExt="mov"){
    const { ffmpeg, fetchFile } = await __ensureFfmpeg();
    const inName = `in.${inputExt || "mov"}`;
    const outName = "out.mp4";
    ffmpeg.FS("writeFile", inName, await fetchFile(inputBlob));
    await ffmpeg.run(
      "-i", inName,
      "-c:v", "libx264",
      "-pix_fmt", "yuv420p",
      "-movflags", "faststart",
      "-c:a", "aac",
      "-b:a", "128k",
      outName
    );
    const data = ffmpeg.FS("readFile", outName);
    try{ ffmpeg.FS("unlink", inName); } catch(_){}
    try{ ffmpeg.FS("unlink", outName); } catch(_){}
    return new Blob([data.buffer], { type: "video/mp4" });
  }

  // ===== 이벤트 =====
  $("modeImage").addEventListener("click", () => setMode("image"));
  $("modeVideo").addEventListener("click", () => setMode("video"));

  $("langKo").addEventListener("click", (e) => { e.preventDefault(); setLang("ko"); });
  $("langEn").addEventListener("click", (e) => { e.preventDefault(); setLang("en"); });

  $("genImage").addEventListener("click", () => renderImage().catch(e => alert(e?.message ?? "오류")));
  $("dlImage").addEventListener("click", () => downloadPng().catch(_=>{}));

  $("mediaFile").addEventListener("change", async () => {
    const file = $("mediaFile").files?.[0];
    if (!file) return;

    if (mode === "image"){
      if (!(file.type || "").startsWith("image/")){
        alert("이미지 모드에서는 이미지 파일만 선택할 수 있습니다.");
        $("mediaFile").value = "";
        return;
      }
      $("dlImage").disabled = true;
      $("noticeImage").style.display = "none";
      return;
    }

    // video mode
    if (!(file.type || "").startsWith("video/")){
      alert("영상 모드에서는 영상 파일만 선택할 수 있습니다.");
      $("mediaFile").value = "";
      return;
    }

    await prepareVideoEditor(file);
  });

  $("videoPlay").addEventListener("click", async () => {
    const pv = $("videoPreview");
    try{ await pv.play(); } catch(_){}
  });
  $("videoPause").addEventListener("click", () => {
    const pv = $("videoPreview");
    try{ pv.pause(); } catch(_){}
  });

  $("genVideo").addEventListener("click", () => { maybeShowFirstGenHint(); return generateVideo().catch(e => alert(e?.message ?? "오류")); });
  $("dlVideo").addEventListener("click", () => downloadVideo().catch(_=>{}));

  // 초기
  (function init(){
    setMode("image");
    setLang("en");
    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#6b7280";
    ctx.font="800 44px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
    ctx.fillText("여기에 결과가 표시됩니다.", 80, 160);
  })();
</script>
